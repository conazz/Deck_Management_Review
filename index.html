<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E6EEF1">
<title>Deck Reviewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#E6EEF1;--paper:#F7FAFB;--ink:#0E2A38;--muted:#557080;--line:#B9CCD4;
  --sea:#1F5E78;--stbd:#1E7A4C;--stbd-bg:#DDF0E5;--port:#B3262E;--port-bg:#F7DEDF;--gold:#946400;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){
    --bg:#0A1B24;--paper:#10262F;--ink:#E3EEF2;--muted:#8FA9B5;--line:#24414E;
    --sea:#5FB2D1;--stbd:#5CC98D;--stbd-bg:#123526;--port:#EF6B71;--port-bg:#3A1A1D;--gold:#FFCF40;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1B24;--paper:#10262F;--ink:#E3EEF2;--muted:#8FA9B5;--line:#24414E;
  --sea:#5FB2D1;--stbd:#5CC98D;--stbd-bg:#123526;--port:#EF6B71;--port-bg:#3A1A1D;--gold:#FFCF40;color-scheme:dark;
}
:root[data-theme="dusk"]{
  --bg:#222F3C;--paper:#2C3C4D;--ink:#E8EEF2;--muted:#A3B5C2;--line:#485C6D;
  --sea:#7FC0DB;--stbd:#6FCF9A;--stbd-bg:#1F4535;--port:#F28088;--port-bg:#4A2830;--gold:#FFD35A;color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{overscroll-behavior-x:none}      /* keep sideways swipes for Previous/Next, not browser back */
main{touch-action:pan-y pinch-zoom}
.updated{margin:0 0 10px;text-align:center;font-size:.85rem;font-weight:600;color:var(--stbd)}
.gdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--stbd);margin-right:7px;vertical-align:middle;box-shadow:0 0 6px 1px color-mix(in srgb,var(--stbd) 60%,transparent)}
@media (prefers-reduced-motion:no-preference){
  .gdot{animation:gdot 1.8s ease-in-out infinite}
  @keyframes gdot{0%,100%{opacity:.25;box-shadow:0 0 0 0 transparent}50%{opacity:1;box-shadow:0 0 9px 2px color-mix(in srgb,var(--stbd) 70%,transparent)}}
}
.modecard.news{border-color:var(--stbd)}
.modecard.news b{color:var(--stbd)}
.newsbadge{display:inline-block;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:.85rem;letter-spacing:.04em;border:1.5px solid var(--stbd);color:var(--stbd);border-radius:6px;padding:1px 8px;margin:2px 6px 6px 0}
.newsbadge.chg{border-color:var(--sea);color:var(--sea)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 "Source Sans 3",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 18px 40px}
h1,h2,h3{font-family:"Barlow Condensed",sans-serif;margin:0}
h1{font-weight:700;font-size:2rem;line-height:1.05}
h2{font-weight:700;font-size:1.35rem;line-height:1.15;margin:22px 0 8px}
h3{font-weight:700;font-size:1.1rem}
.sub{color:var(--muted);font-size:.95rem;margin:4px 0 0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.topbar{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.topbar .btns{display:flex;gap:8px;flex:none}
.sm{background:transparent;border:1.5px solid var(--line);border-radius:6px;padding:6px 10px;font-size:.9rem;min-height:36px}
.sm:hover{border-color:var(--sea)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:20px 18px;margin:0 0 14px}
.card.tight{padding:14px 16px}
.label{font-family:"Barlow Condensed",sans-serif;font-weight:500;font-size:1rem;color:var(--sea)}
.qtext{font-weight:600;font-size:1.15rem;line-height:1.4;margin:6px 0 14px;overflow-wrap:anywhere}
.btn{display:block;width:100%;background:var(--sea);color:var(--paper);border:0;border-radius:6px;padding:14px;margin-top:14px;
  font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.15rem;letter-spacing:.03em;text-align:center;min-height:48px}
.btn.alt{background:transparent;color:var(--sea);border:1.5px solid var(--sea)}
.btn[disabled]{opacity:.45;cursor:default}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns2 .btn{margin-top:14px}
.btns2>:only-child{grid-column:1/-1}
/* choices */
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:transparent;border:1.5px solid var(--line);border-radius:6px;padding:12px;min-height:44px}
.choice:hover:not([aria-disabled="true"]){border-color:var(--sea)}
.txt-wrap{min-width:0;flex:1}
.choice .ltr{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.05rem;color:var(--sea);flex:none;width:1.1em}
.choice .txt{overflow-wrap:anywhere;min-width:0}
.choice.correct{border-color:var(--stbd);background:var(--stbd-bg)}
.choice.correct .ltr{color:var(--stbd)}
.choice.wrong{border-color:var(--port);background:var(--port-bg)}
.choice.wrong .ltr{color:var(--port)}
.choice.picked{border-color:var(--sea);border-width:2px;padding:11.5px}
.choice[aria-disabled="true"]{cursor:default}
.tagtxt{display:block;font-size:.85rem;font-weight:600;margin-top:2px}
.correct .tagtxt{color:var(--stbd)}.wrong .tagtxt{color:var(--port)}
.feedback{min-height:1.5em;margin:12px 0 0;font-weight:600}
.feedback.ok{color:var(--stbd)}.feedback.bad{color:var(--port)}
/* tools */
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:12px}
.tool{display:inline-flex;align-items:center;gap:6px;min-width:44px;min-height:44px;justify-content:center;background:transparent;border:1.5px solid var(--line);border-radius:6px;color:var(--muted);padding:0 10px}
.tool .tl{font-size:.88rem;font-weight:600}
.tool svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{border-color:var(--sea)}
.tool.on{color:var(--sea);border-color:var(--sea)}
.tool.star.on{color:var(--gold);border-color:var(--gold);box-shadow:0 0 10px 1px color-mix(in srgb,var(--gold) 55%,transparent)}
.tool.star.on svg{fill:currentColor;filter:drop-shadow(0 0 4px var(--gold))}
.tool.note.on{color:var(--sea);border-color:var(--sea);box-shadow:0 0 10px 1px color-mix(in srgb,var(--sea) 55%,transparent)}
.tool.note.on svg{fill:none;filter:drop-shadow(0 0 4px var(--sea))}
.tool.mast.on{color:var(--stbd);border-color:var(--stbd);box-shadow:0 0 10px 1px color-mix(in srgb,var(--stbd) 55%,transparent)}
.tool.mast.on svg{filter:drop-shadow(0 0 4px var(--stbd))}
.tool.mast.on svg circle{fill:currentColor}
.tool.mast.on svg path{stroke:var(--paper)}
.tool .n{font-size:.85rem;font-weight:700}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 10px;border-radius:6px;border:1.5px solid var(--line);background:transparent;font-size:.9rem}
.chip.on{border-color:var(--sea);color:var(--sea);font-weight:600}
.chip.inc{border-color:var(--port);color:var(--port);font-weight:600}
.pickcard{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:0 0 8px;min-height:44px}
button.pickcard:hover{border-color:var(--sea)}
.pickcard .pq{font-weight:600;margin:4px 0 6px;overflow-wrap:anywhere}
.pickcard .pc{display:flex;gap:8px;font-size:.95rem;line-height:1.35;margin:3px 0}
.pickcard .pc .ltr{font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--sea);flex:none;width:1.1em}
.pickcard .pc span:last-child{min-width:0;overflow-wrap:anywhere}
.lockico{display:inline-flex;flex:none}
.lockico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.notice{display:flex;gap:10px;align-items:flex-start;margin:10px 0 4px;padding:10px 12px;border:1.5px solid var(--sea);border-radius:6px;font-weight:600;font-size:.95rem;line-height:1.4}
.notice .lockico{color:var(--sea);margin-top:1px}
.rowmain.locked{border-style:dashed;background:transparent;color:var(--muted);cursor:pointer}
.rowmain.locked:hover{border-color:var(--line)}
.rowmain.locked .code,.rowmain.locked .rname,.rowmain.locked .rmeta{color:var(--muted)}
.rowmain.locked .lockico{margin-left:auto}
.lockchip{display:inline-block;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:.85rem;letter-spacing:.08em;border:1.5px solid var(--muted);border-radius:6px;padding:0 7px;margin-right:6px;color:var(--muted)}
.lockbig{display:flex;justify-content:center;color:var(--muted);margin:2px 0 10px}
.lockbig svg{width:56px;height:56px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.solving{margin:14px 0 4px;padding:10px 12px;border:1px solid var(--line);border-left:3px solid var(--sea);border-radius:6px}
.solving .label{display:block;margin-bottom:4px}
.solving p{margin:3px 0;font-size:.95rem;line-height:1.45;overflow-wrap:anywhere}
.solving .note{margin-top:8px;color:var(--muted);font-size:.9rem}
.modecard.conf{border-color:var(--gold);box-shadow:0 0 8px 1px color-mix(in srgb,var(--gold) 50%,transparent)}
.modecard.conf b{color:var(--gold)}
@media (prefers-reduced-motion:no-preference){
  .modecard.conf{animation:confcard 2.6s ease-in-out infinite}
  @keyframes confcard{0%,100%{box-shadow:0 0 3px 0 color-mix(in srgb,var(--gold) 25%,transparent);border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}50%{box-shadow:0 0 14px 3px color-mix(in srgb,var(--gold) 75%,transparent);border-color:var(--gold)}}
}
.tally{margin-left:auto;display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:0 2px}
.trow{display:flex;align-items:center;gap:6px;font-size:.85rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.ttrack{display:inline-flex;width:54px;height:9px;border-radius:3px;background:color-mix(in srgb,var(--line) 55%,transparent)}
.tbar{display:block;height:9px;border-radius:3px}
.tbar.ok{background:var(--stbd)}
.tbar.bad{background:var(--port)}
.chip.newq{background:var(--sea);border-color:var(--sea);color:var(--paper);font-weight:700;letter-spacing:.02em}
.chip.conf{border-color:var(--gold);color:var(--gold);font-weight:700;box-shadow:0 0 8px 1px color-mix(in srgb,var(--gold) 50%,transparent)}
@media (prefers-reduced-motion:no-preference){
  .chip.conf{animation:confflash 2.6s ease-in-out infinite}
  @keyframes confflash{0%,100%{box-shadow:0 0 3px 0 color-mix(in srgb,var(--gold) 25%,transparent);opacity:.7}50%{box-shadow:0 0 13px 3px color-mix(in srgb,var(--gold) 75%,transparent);opacity:1}}
}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
/* highlights + diffs: tokens only */
mark.hl{background:color-mix(in srgb,var(--sea) 28%,transparent);color:inherit;border-radius:3px;padding:0 1px;cursor:pointer}
.kw{background:color-mix(in srgb,var(--sea) 34%,transparent);border-radius:3px;font-weight:700;color:inherit}
.diff{background:color-mix(in srgb,var(--sea) 22%,transparent);border-bottom:2px solid var(--sea);font-weight:700}
.diff.soft{background:transparent;border-bottom:1px dashed var(--sea);font-weight:400}
.diffc{background:var(--gold);color:var(--paper);border-radius:2px;font-weight:700;padding:0 1px}
.diffsp{background:var(--gold);color:var(--paper);border-radius:3px;padding:0 2px;font-size:.8em;vertical-align:1px}
.diffgap{color:var(--port);font-weight:700;margin:0 1px;font-size:1.05em}
.cmplist{margin:0;padding-left:18px}.cmplist li{margin:0 0 4px}
.cmplist li.k-neg{color:var(--port);font-weight:600}
.hook{background:color-mix(in srgb,var(--gold) 20%,transparent);border-radius:3px;padding:0 3px;font-weight:600}
/* voyage track */
.track{position:relative;display:flex;justify-content:space-between;align-items:center;margin:4px 2px 16px;height:20px}
.track::before{content:"";position:absolute;left:6px;right:6px;top:50%;border-top:2px dashed var(--line)}
.dot{position:relative;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--line);padding:0;cursor:pointer;flex:none}
.dot::after{content:"";position:absolute;inset:-14px -3px}   /* bigger tap area than the 12px dot */
.dot.ok{background:var(--stbd);border-color:var(--stbd)}
.dot.bad{background:var(--port);border-color:var(--port)}
.dot.cur{border-color:var(--sea);box-shadow:0 0 0 4px color-mix(in srgb,var(--sea) 25%,transparent)}
.dot.fill{background:var(--sea);border-color:var(--sea)}
/* lists */
.row{display:flex;gap:8px;align-items:stretch;margin:0 0 8px}
.rowmain{flex:1;min-width:0;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-height:56px;display:flex;gap:12px;align-items:center}
.rowmain:hover{border-color:var(--sea)}
.code{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.2rem;color:var(--sea);flex:none;min-width:2.6em}
.rname{font-size:.95rem;line-height:1.3;flex:1;min-width:0}
.rmeta{font-size:.8rem;color:var(--muted);margin-top:2px}
.rowx{display:flex;flex-direction:column;gap:6px;flex:none}
.modecard{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin:0 0 10px;min-height:64px}
.modecard:hover{border-color:var(--sea)}
.modecard b{font-family:"Barlow Condensed",sans-serif;font-size:1.3rem;color:var(--sea);display:block}
.score{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:4.5rem;line-height:1}
.miss{border-top:1px solid var(--line);padding:14px 0}
.miss:first-child{border-top:0}
.ym{color:var(--port);font-weight:600}.cm{color:var(--stbd);font-weight:600}
.pass{color:var(--stbd);font-weight:700}.fail{color:var(--port);font-weight:700}
.timer{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.5rem;color:var(--sea);font-variant-numeric:tabular-nums}
.timers{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 12px}
.timers .label{display:block}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin:10px 0}
.nb{min-height:44px;border:1.5px solid var(--line);border-radius:6px;background:transparent;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.05rem;position:relative}
.nb.ans{background:color-mix(in srgb,var(--sea) 22%,transparent);border-color:var(--sea);color:var(--sea)}
.nb.cur{outline:3px solid var(--sea);outline-offset:1px}
.nb .st{position:absolute;top:1px;right:3px;font-size:.7rem;color:var(--sea)}
input[type=text],input[type=email],input[type=password],input[type=number],textarea,input[type=search]{
  width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;min-height:44px}
textarea{min-height:70px;resize:vertical}
.field{margin:8px 0}
/* overlay sheet */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 78%,transparent);z-index:20;display:flex;align-items:flex-end;justify-content:center;overflow:auto}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:6px;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:18px;margin:0 auto;
  padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.overlay{align-items:center}}
.sheet .sel{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;overflow-wrap:anywhere}
.opt{display:flex;gap:10px;margin:8px 0;align-items:flex-start}
.opt .ltr{font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--sea);flex:none;width:1.1em}
.notebox{border-top:1px solid var(--line);padding:10px 0}
.tourlayer{position:fixed;inset:0;z-index:70}
.tourlayer.dim{background:rgba(0,0,0,.55)}
.tourhole{position:fixed;border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.55);outline:2.5px solid var(--gold);outline-offset:2px;transition:all .25s ease;pointer-events:none}
.tourbub{position:fixed;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.35);transition:top .25s ease,left .25s ease}
.tourbub .btns2 .btn{margin-top:12px}
.tourtop{display:flex;justify-content:space-between;align-items:center}
.tourdots{display:flex;gap:6px;justify-content:center;margin:12px 0 0;flex-wrap:wrap}
.tourdots span{width:7px;height:7px;border-radius:50%;background:var(--line)}
.tourdots span.on{background:var(--sea)}
@media (prefers-reduced-motion:reduce){.tourhole,.tourbub{transition:none}}
.linkbtn{background:none;border:0;color:var(--sea);text-decoration:underline;font:inherit;font-weight:600;padding:12px 0 0;cursor:pointer;display:block}
.err{color:var(--port);font-weight:600;min-height:1.5em}
.hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.pair{display:grid;gap:12px}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin:-8px 0 8px}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .card,.modecard{animation:rise .25s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
.sr{position:absolute;left:-9999px}
.overlay.top{z-index:60}
</style>
</head>
<body>
<main id="app" aria-live="off"></main>

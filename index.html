<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E6EEF1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deck Review">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Deck Reviewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#E6EEF1;--paper:#F7FAFB;--ink:#0E2A38;--muted:#557080;--line:#B9CCD4;
  --sea:#1F5E78;--stbd:#1E7A4C;--stbd-bg:#DDF0E5;--port:#B3262E;--port-bg:#F7DEDF;--gold:#946400;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){
    --bg:#0A1B24;--paper:#10262F;--ink:#E3EEF2;--muted:#8FA9B5;--line:#24414E;
    --sea:#5FB2D1;--stbd:#5CC98D;--stbd-bg:#123526;--port:#EF6B71;--port-bg:#3A1A1D;--gold:#FFCF40;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1B24;--paper:#10262F;--ink:#E3EEF2;--muted:#8FA9B5;--line:#24414E;
  --sea:#5FB2D1;--stbd:#5CC98D;--stbd-bg:#123526;--port:#EF6B71;--port-bg:#3A1A1D;--gold:#FFCF40;color-scheme:dark;
}
:root[data-theme="dusk"]{
  /* ===== DUSK THEME: edit the Dusk colours here (warm brown, amber, cream; like the ETA Calculator) ===== */
  --bg:#17110D;            /* page background (very dark warm brown) */
  --paper:#211812;         /* cards, panels, dialogs (a little lighter than the background) */
  --ink:#F3E9D7;           /* main text and titles (cream) */
  --muted:#B4A08A;         /* secondary text */
  --line:#4A3726;          /* thin amber-brown borders */
  --sea:#F0A63A;           /* main accent: buttons, links, selected items (amber) */
  --accent:#E8893A;        /* section headings and small labels (orange), e.g. "FOR DECK OFFICERS" */
  --glow:rgba(255,196,120,.28);   /* the soft warm glow behind main titles */
  --dot:rgba(240,166,58,.10);     /* the dotted grid on the background */
  --stbd:#7FD08F;--stbd-bg:#1E3322;   /* right / green */
  --port:#F07A62;--port-bg:#3A1D17;   /* wrong / red */
  --gold:#FFC44D;
  --badge-amber:rgba(240,166,58,.20);--badge-orange:rgba(232,120,58,.22);--badge-green:rgba(110,190,110,.20);--badge-red:rgba(230,90,70,.22);
  color-scheme:dark;
}
/* ===== DOWNLOAD BUTTON: the light that orbits the edge. Edit speed and colours here ===== */
:root{
  --spin-duration:8s;              /* one full lap of the light (bigger = slower) */
  --spin-color:#00D4FF;            /* Day (Light) theme: neon blue */
  --spin-glow:rgba(31,182,255,.55);
  --dl-fill:linear-gradient(135deg,rgba(255,255,255,.92),rgba(214,236,246,.85));
  --dl-text:#0E2A38;--dl-border:rgba(31,94,120,.35);
}
:root[data-theme="dark"],:root[data-theme="dusk"]{
  --spin-color:#FFD23F;            /* Night (Dark) and Dusk: bright gold */
  --spin-glow:rgba(255,196,0,.5);
}
:root[data-theme="dark"]{--dl-fill:linear-gradient(135deg,rgba(32,64,80,.95),rgba(16,38,47,.9));--dl-text:#E3EEF2;--dl-border:rgba(255,210,63,.35)}
:root[data-theme="dusk"]{--dl-fill:linear-gradient(135deg,rgba(52,38,27,.95),rgba(33,24,18,.9));--dl-text:#F3E9D7;--dl-border:rgba(240,166,58,.45)}
@media (prefers-color-scheme:dark){ :root:not([data-theme]){--spin-color:#FFD23F;--spin-glow:rgba(255,196,0,.5);--dl-fill:linear-gradient(135deg,rgba(32,64,80,.95),rgba(16,38,47,.9));--dl-text:#E3EEF2;--dl-border:rgba(255,210,63,.35)} }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{overscroll-behavior-x:none}      /* keep sideways swipes for Previous/Next, not browser back */
main{touch-action:pan-y pinch-zoom}
.updated{margin:0 0 10px;text-align:center;font-size:.85rem;font-weight:600;color:var(--stbd)}
.gdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--stbd);margin-right:7px;vertical-align:middle;box-shadow:0 0 6px 1px color-mix(in srgb,var(--stbd) 60%,transparent)}
@media (prefers-reduced-motion:no-preference){
  .gdot{animation:gdot 1.8s ease-in-out infinite}
  @keyframes gdot{0%,100%{opacity:.25;box-shadow:0 0 0 0 transparent}50%{opacity:1;box-shadow:0 0 9px 2px color-mix(in srgb,var(--stbd) 70%,transparent)}}
}
.modecard.news{border-color:var(--stbd)}
.modecard.news b{color:var(--stbd)}
.newsbadge{display:inline-block;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:.85rem;letter-spacing:.04em;border:1.5px solid var(--stbd);color:var(--stbd);border-radius:6px;padding:1px 8px;margin:2px 6px 6px 0}
.newsbadge.chg{border-color:var(--sea);color:var(--sea)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 "Source Sans 3",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 18px 40px}
h1,h2,h3{font-family:"Barlow Condensed",sans-serif;margin:0}
h1{font-weight:700;font-size:2rem;line-height:1.05}
h2{font-weight:700;font-size:1.35rem;line-height:1.15;margin:22px 0 8px}
h3{font-weight:700;font-size:1.1rem}
.sub{color:var(--muted);font-size:.95rem;margin:4px 0 0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.topbar{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.topbar .btns{display:flex;gap:8px;flex:none}
.sm{background:transparent;border:1.5px solid var(--line);border-radius:6px;padding:6px 10px;font-size:.9rem;min-height:36px}
.sm:hover{border-color:var(--sea)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:20px 18px;margin:0 0 14px}
.card.tight{padding:14px 16px}
.label{font-family:"Barlow Condensed",sans-serif;font-weight:500;font-size:1rem;color:var(--sea)}
.qtext{font-weight:600;font-size:1.15rem;line-height:1.4;margin:6px 0 14px;overflow-wrap:anywhere}
.btn{display:block;width:100%;background:var(--sea);color:var(--paper);border:0;border-radius:6px;padding:14px;margin-top:14px;
  font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.15rem;letter-spacing:.03em;text-align:center;min-height:48px}
.btn.alt{background:transparent;color:var(--sea);border:1.5px solid var(--sea)}
.btn[disabled]{opacity:.45;cursor:default}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns2 .btn{margin-top:14px}
.btns2>:only-child{grid-column:1/-1}
/* choices */
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:transparent;border:1.5px solid var(--line);border-radius:6px;padding:12px;min-height:44px}
.choice:hover:not([aria-disabled="true"]){border-color:var(--sea)}
.txt-wrap{min-width:0;flex:1}
.choice .ltr{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.05rem;color:var(--sea);flex:none;width:1.1em}
.choice .txt{overflow-wrap:anywhere;min-width:0}
.choice.correct{border-color:var(--stbd);background:var(--stbd-bg)}
.choice.correct .ltr{color:var(--stbd)}
.choice.wrong{border-color:var(--port);background:var(--port-bg)}
.choice.wrong .ltr{color:var(--port)}
.choice.picked{border-color:var(--sea);border-width:2px;padding:11.5px}
.choice[aria-disabled="true"]{cursor:default}
.tagtxt{display:block;font-size:.85rem;font-weight:600;margin-top:2px}
.correct .tagtxt{color:var(--stbd)}.wrong .tagtxt{color:var(--port)}
.feedback{min-height:1.5em;margin:12px 0 0;font-weight:600}
.feedback.ok{color:var(--stbd)}.feedback.bad{color:var(--port)}
/* tools */
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:12px}
.tool{display:inline-flex;align-items:center;gap:6px;min-width:44px;min-height:44px;justify-content:center;background:transparent;border:1.5px solid var(--line);border-radius:6px;color:var(--muted);padding:0 10px}
.tool .tl{font-size:.88rem;font-weight:600}
.tool svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{border-color:var(--sea)}
.tool.on{color:var(--sea);border-color:var(--sea)}
.tool.star.on{color:var(--gold);border-color:var(--gold);box-shadow:0 0 10px 1px color-mix(in srgb,var(--gold) 55%,transparent)}
.tool.star.on svg{fill:currentColor;filter:drop-shadow(0 0 4px var(--gold))}
.tool.note.on{color:var(--sea);border-color:var(--sea);box-shadow:0 0 10px 1px color-mix(in srgb,var(--sea) 55%,transparent)}
.tool.note.on svg{fill:none;filter:drop-shadow(0 0 4px var(--sea))}
.tool.mast.on{color:var(--stbd);border-color:var(--stbd);box-shadow:0 0 10px 1px color-mix(in srgb,var(--stbd) 55%,transparent)}
.tool.mast.on svg{filter:drop-shadow(0 0 4px var(--stbd))}
.tool.mast.on svg circle{fill:currentColor}
.tool.mast.on svg path{stroke:var(--paper)}
.tool .n{font-size:.85rem;font-weight:700}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 10px;border-radius:6px;border:1.5px solid var(--line);background:transparent;font-size:.9rem}
.chip.on{border-color:var(--sea);color:var(--sea);font-weight:600}
.chip.inc{border-color:var(--port);color:var(--port);font-weight:600}
.pickcard{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:0 0 8px;min-height:44px}
button.pickcard:hover{border-color:var(--sea)}
.pickcard .pq{font-weight:600;margin:4px 0 6px;overflow-wrap:anywhere}
.pickcard .pc{display:flex;gap:8px;font-size:.95rem;line-height:1.35;margin:3px 0}
.pickcard .pc .ltr{font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--sea);flex:none;width:1.1em}
.pickcard .pc span:last-child{min-width:0;overflow-wrap:anywhere}
.lockico{display:inline-flex;flex:none}
.lockico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.notice{display:flex;gap:10px;align-items:flex-start;margin:10px 0 4px;padding:10px 12px;border:1.5px solid var(--sea);border-radius:6px;font-weight:600;font-size:.95rem;line-height:1.4}
.notice .lockico{color:var(--sea);margin-top:1px}
.rowmain.locked{border-style:dashed;background:transparent;color:var(--muted);cursor:pointer}
.rowmain.locked:hover{border-color:var(--line)}
.rowmain.locked .code,.rowmain.locked .rname,.rowmain.locked .rmeta{color:var(--muted)}
.rowmain.locked .lockico{margin-left:auto}
.lockchip{display:inline-block;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:.85rem;letter-spacing:.08em;border:1.5px solid var(--muted);border-radius:6px;padding:0 7px;margin-right:6px;color:var(--muted)}
.lockbig{display:flex;justify-content:center;color:var(--muted);margin:2px 0 10px}
.lockbig svg{width:56px;height:56px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.solving{margin:14px 0 4px;padding:10px 12px;border:1px solid var(--line);border-left:3px solid var(--sea);border-radius:6px}
.solving .label{display:block;margin-bottom:4px}
.solving p{margin:3px 0;font-size:.95rem;line-height:1.45;overflow-wrap:anywhere}
.solving .note{margin-top:8px;color:var(--muted);font-size:.9rem}
.modecard.conf{border-color:var(--gold);box-shadow:0 0 8px 1px color-mix(in srgb,var(--gold) 50%,transparent)}
.modecard.conf b{color:var(--gold)}
@media (prefers-reduced-motion:no-preference){
  .modecard.conf{animation:confcard 2.6s ease-in-out infinite}
  @keyframes confcard{0%,100%{box-shadow:0 0 3px 0 color-mix(in srgb,var(--gold) 25%,transparent);border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}50%{box-shadow:0 0 14px 3px color-mix(in srgb,var(--gold) 75%,transparent);border-color:var(--gold)}}
}
.tally{margin-left:auto;display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:0 2px}
.trow{display:flex;align-items:center;gap:6px;font-size:.85rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.ttrack{display:inline-flex;width:54px;height:9px;border-radius:3px;background:color-mix(in srgb,var(--line) 55%,transparent)}
.tbar{display:block;height:9px;border-radius:3px}
.tbar.ok{background:var(--stbd)}
.tbar.bad{background:var(--port)}
.chip.newq{background:var(--sea);border-color:var(--sea);color:var(--paper);font-weight:700;letter-spacing:.02em}
.chip.conf{border-color:var(--gold);color:var(--gold);font-weight:700;box-shadow:0 0 8px 1px color-mix(in srgb,var(--gold) 50%,transparent)}
@media (prefers-reduced-motion:no-preference){
  .chip.conf{animation:confflash 2.6s ease-in-out infinite}
  @keyframes confflash{0%,100%{box-shadow:0 0 3px 0 color-mix(in srgb,var(--gold) 25%,transparent);opacity:.7}50%{box-shadow:0 0 13px 3px color-mix(in srgb,var(--gold) 75%,transparent);opacity:1}}
}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
/* highlights + diffs: tokens only */
mark.hl{background:color-mix(in srgb,var(--sea) 28%,transparent);color:inherit;border-radius:3px;padding:0 1px;cursor:pointer}
.kw{background:color-mix(in srgb,var(--sea) 34%,transparent);border-radius:3px;font-weight:700;color:inherit}
.diff{background:color-mix(in srgb,var(--sea) 22%,transparent);border-bottom:2px solid var(--sea);font-weight:700}
.diff.soft{background:transparent;border-bottom:1px dashed var(--sea);font-weight:400}
.diffc{background:var(--gold);color:var(--paper);border-radius:2px;font-weight:700;padding:0 1px}
.diffsp{background:var(--gold);color:var(--paper);border-radius:3px;padding:0 2px;font-size:.8em;vertical-align:1px}
.diffgap{color:var(--port);font-weight:700;margin:0 1px;font-size:1.05em}
.cmplist{margin:0;padding-left:18px}.cmplist li{margin:0 0 4px}
.cmplist li.k-neg{color:var(--port);font-weight:600}
.hook{background:color-mix(in srgb,var(--gold) 20%,transparent);border-radius:3px;padding:0 3px;font-weight:600}
/* voyage track */
.track{position:relative;display:flex;justify-content:space-between;align-items:center;margin:4px 2px 16px;height:20px}
.track::before{content:"";position:absolute;left:6px;right:6px;top:50%;border-top:2px dashed var(--line)}
.dot{position:relative;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--line);padding:0;cursor:pointer;flex:none}
.dot::after{content:"";position:absolute;inset:-14px -3px}   /* bigger tap area than the 12px dot */
.dot.ok{background:var(--stbd);border-color:var(--stbd)}
.dot.bad{background:var(--port);border-color:var(--port)}
.dot.cur{border-color:var(--sea);box-shadow:0 0 0 4px color-mix(in srgb,var(--sea) 25%,transparent)}
.trackbtns{display:flex;justify-content:flex-end;gap:8px;margin:-8px 0 12px}
.wrongbtn{border-color:var(--port);color:var(--port);font-weight:700}
.nb.ok{background:var(--stbd-bg);border-color:var(--stbd);color:var(--stbd)}
.nb.bad{background:var(--port-bg);border-color:var(--port);color:var(--port)}
.dot.fill{background:var(--sea);border-color:var(--sea)}
/* lists */
.row{display:flex;gap:8px;align-items:stretch;margin:0 0 8px}
.rowmain{flex:1;min-width:0;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-height:56px;display:flex;gap:12px;align-items:center}
.rowmain:hover{border-color:var(--sea)}
.code{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.2rem;color:var(--sea);flex:none;min-width:2.6em}
.rname{font-size:.95rem;line-height:1.3;flex:1;min-width:0}
.rmeta{font-size:.8rem;color:var(--muted);margin-top:2px}
.rowx{display:flex;flex-direction:column;gap:6px;flex:none}
.modecard{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin:0 0 10px;min-height:64px}
.modecard:hover{border-color:var(--sea)}
.modecard b{font-family:"Barlow Condensed",sans-serif;font-size:1.3rem;color:var(--sea);display:block}
.score{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:4.5rem;line-height:1}
.miss{border-top:1px solid var(--line);padding:14px 0}
.miss:first-child{border-top:0}
.ym{color:var(--port);font-weight:600}.cm{color:var(--stbd);font-weight:600}
.pass{color:var(--stbd);font-weight:700}.fail{color:var(--port);font-weight:700}
.timer{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.5rem;color:var(--sea);font-variant-numeric:tabular-nums}
.timers{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 12px}
.timers .label{display:block}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin:10px 0}
.nb{min-height:44px;border:1.5px solid var(--line);border-radius:6px;background:transparent;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.05rem;position:relative}
.nb.ans{background:color-mix(in srgb,var(--sea) 22%,transparent);border-color:var(--sea);color:var(--sea)}
.nb.cur{outline:3px solid var(--sea);outline-offset:1px}
.nb .st{position:absolute;top:1px;right:3px;font-size:.7rem;color:var(--sea)}
input[type=text],input[type=email],input[type=password],input[type=number],textarea,input[type=search]{
  width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;min-height:44px}
textarea{min-height:70px;resize:vertical}
.field{margin:8px 0}
/* overlay sheet */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 78%,transparent);z-index:20;display:flex;align-items:flex-end;justify-content:center;overflow:auto}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:6px;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:18px;margin:0 auto;
  padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.overlay{align-items:center}}
.sheet .sel{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;overflow-wrap:anywhere}
.opt{display:flex;gap:10px;margin:8px 0;align-items:flex-start}
.opt .ltr{font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--sea);flex:none;width:1.1em}
.notebox{border-top:1px solid var(--line);padding:10px 0}
.tourlayer{position:fixed;inset:0;z-index:70}
.tourlayer.dim{background:rgba(0,0,0,.55)}
.tourhole{position:fixed;border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.55);outline:2.5px solid var(--gold);outline-offset:2px;transition:all .25s ease;pointer-events:none}
.tourbub{position:fixed;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.35);transition:top .25s ease,left .25s ease}
.tourbub .btns2 .btn{margin-top:12px}
.tourtop{display:flex;justify-content:space-between;align-items:center}
.tourdots{display:flex;gap:6px;justify-content:center;margin:12px 0 0;flex-wrap:wrap}
.tourdots span{width:7px;height:7px;border-radius:50%;background:var(--line)}
.tourdots span.on{background:var(--sea)}
@media (prefers-reduced-motion:reduce){.tourhole,.tourbub{transition:none}}
.sharewarn{color:var(--port);font-weight:600;font-size:.9rem;margin:4px 0}
.appbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.appbar .updated{margin:0}
.brandmini{display:inline-flex;align-items:center;gap:6px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:.82rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
.bm-logo{display:inline-flex;width:14px;height:22px}.bm-logo svg{width:100%;height:100%}
.linkbtn{background:none;border:0;color:var(--sea);text-decoration:underline;font:inherit;font-weight:600;padding:12px 0 0;cursor:pointer;display:block}
.err{color:var(--port);font-weight:600;min-height:1.5em}
.hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.pair{display:grid;gap:12px}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin:-8px 0 8px}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .card,.modecard{animation:rise .25s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
/* loading page (night sea; the ship's lights gather into a vessel seen head-on). Same look in every theme. */
.landing{position:fixed;inset:0;z-index:15;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 20px calc(24px + env(safe-area-inset-bottom));background:radial-gradient(120% 70% at 50% 0%,#12304a 0%,#0b2236 45%,#092030 100%);color:#f2ead8;text-align:center}
.landlogo{width:min(72vw,320px);height:auto;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.landlogo.svg{width:min(34vw,140px);box-shadow:none}.landlogo.svg svg{width:100%;height:auto}
.landsub{margin:0 0 6px;font-size:.95rem;letter-spacing:.06em;color:#b9c6d4}
.landbtn{width:min(86vw,340px);min-height:54px;border-radius:10px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.25rem;letter-spacing:.04em;cursor:pointer}
.landbtn.dl{background:transparent;color:#f2b84b;border:2px solid #f2b84b}
.landbtn.go{background:#f2b84b;color:#092030;border:2px solid #f2b84b}
.landnote{margin:4px 0 0;font-size:.82rem;color:#8ea0b3;max-width:320px}
:root[data-theme="dusk"] .landing{background:radial-gradient(120% 70% at 50% 0%,rgba(240,166,58,.10),transparent 60%),radial-gradient(var(--dot) 1px,transparent 1.2px) 0 0/22px 22px,var(--bg);color:var(--ink)}
:root[data-theme="dusk"] .landsub{color:var(--sea)}:root[data-theme="dusk"] .landnote{color:var(--muted)}
:root[data-theme="dusk"] .landbtn.go{background:var(--sea);border-color:var(--sea);color:#1A120C;border-radius:14px}
#loader{position:fixed;inset:0;z-index:100;overflow:hidden;background:radial-gradient(120% 60% at 50% 0%,#111a28 0%,#0c111a 45%,#0a0d13 100%);color:#e8eef5;transition:opacity .6s ease;cursor:pointer;-webkit-tap-highlight-color:transparent}
#loader.done{opacity:0;pointer-events:none}
#loader .star{position:absolute;width:2px;height:2px;border-radius:50%;background:#cfd8e3;opacity:.55;animation:twinkle 3.2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.8}}
#loader .brand{position:absolute;left:0;right:0;top:24%;text-align:center}
@keyframes brandin{0%{opacity:0;filter:blur(2px)}60%{opacity:.6}100%{opacity:1;filter:none}}
#loader .brand svg{width:84px;height:128px;display:block;margin:0 auto 12px;overflow:visible;filter:drop-shadow(0 0 8px rgba(80,180,230,.35))}
/* the logo builds itself: shoulder board fades in, the anchor slides in from the left, then the gold stripes from the right */
#loader .lb-board{animation:lbfade .7s ease-out .1s both}
#loader .lb-anchor{animation:lbleft .65s cubic-bezier(.2,.8,.2,1) .8s both}
#loader .lb-bars rect{animation:lbright .45s cubic-bezier(.2,.8,.2,1) both}
#loader .lb-bars rect:nth-child(1){animation-delay:1.8s}#loader .lb-bars rect:nth-child(2){animation-delay:2.05s}#loader .lb-bars rect:nth-child(3){animation-delay:2.3s}#loader .lb-bars rect:nth-child(4){animation-delay:2.55s}   /* the stripes one by one, top to bottom */
@keyframes lbfade{from{opacity:0}to{opacity:1}}
@keyframes lbleft{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:none}}
@keyframes lbright{from{opacity:0;transform:translateX(46px)}to{opacity:1;transform:none}}
#loader .brand .t1,#loader .brand .t2{animation:brandin 1.4s ease-out .3s both}
#loader .t1{font-family:"Source Sans 3",system-ui,sans-serif;font-weight:700;font-size:clamp(15px,4.6vw,20px);letter-spacing:.14em;text-shadow:0 0 14px rgba(160,200,235,.35);animation:glow 3s ease-in-out .8s both}
@keyframes glow{0%{color:#8a96a6}100%{color:#e8eef5}}
#loader .t2{font-family:"Source Sans 3",system-ui,sans-serif;font-size:clamp(9px,2.6vw,11px);letter-spacing:.2em;color:#7f8b9c;margin-top:4px}
#loader .horizon{position:absolute;left:0;right:0;top:78%;height:1px;background:linear-gradient(90deg,transparent,rgba(140,170,200,.35) 20%,rgba(140,170,200,.35) 80%,transparent)}
#loader .wave{position:absolute;height:1px;background:linear-gradient(90deg,transparent,rgba(120,150,180,.25),transparent);animation:wave 4s ease-in-out infinite}
@keyframes wave{0%,100%{transform:translateX(-6px);opacity:.5}50%{transform:translateX(6px);opacity:1}}
#loader .lt{position:absolute;left:0;top:0;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;opacity:0;animation:3s cubic-bezier(.45,.05,.3,1) .3s both}
#loader .lt.w{background:#fff;box-shadow:0 0 8px 3px #fff,0 0 30px 16px rgba(255,255,255,.2),0 0 60px 26px rgba(255,255,255,.07)}
#loader .lt.w.big{width:13px;height:13px;margin:-6.5px 0 0 -6.5px;box-shadow:0 0 10px 4px #fff,0 0 42px 22px rgba(255,255,255,.2),0 0 80px 34px rgba(255,255,255,.07)}
#loader .lt.g{background:#3ddc84;box-shadow:0 0 8px 3px #2fbf6c,0 0 30px 14px rgba(47,191,108,.25)}
#loader .lt.r{background:#ff4d4d;box-shadow:0 0 8px 3px #e33,0 0 30px 14px rgba(230,50,50,.25)}
/* each light (Con, 26 Oct 2026): slides in from the side, one by one, alternating left / right (l1 from the left, l2 right, l3 left, l4 right);
 when all four sit in a row they glow together, then each sails to its place on the ship seen head-on. Timing: 3 s from 0.3 s; positions in % of the screen */
@keyframes l1{0%{opacity:.85;left:-6%;top:60%;transform:scale(.8);filter:brightness(.8)}23.33%,52%{opacity:.85;left:45%;top:60%;transform:scale(.8);filter:brightness(.8)}61%{opacity:1;left:45%;top:60%;transform:scale(1.7);filter:brightness(1.6)}71%{opacity:1;left:45%;top:60%;transform:scale(1.25);filter:brightness(1.3)}96.67%,100%{opacity:1;left:50%;top:58%;transform:scale(1);filter:brightness(1)}}
@keyframes l2{0%,8.33%{opacity:.85;left:106%;top:60%;transform:scale(.8);filter:brightness(.8)}31.66%,52%{opacity:.85;left:55%;top:60%;transform:scale(.8);filter:brightness(.8)}61%{opacity:1;left:55%;top:60%;transform:scale(1.7);filter:brightness(1.6)}71%{opacity:1;left:55%;top:60%;transform:scale(1.25);filter:brightness(1.3)}96.67%,100%{opacity:1;left:50%;top:68.5%;transform:scale(1);filter:brightness(1)}}
@keyframes l3{0%,16.66%{opacity:.85;left:-6%;top:60%;transform:scale(.8);filter:brightness(.8)}39.99%,52%{opacity:.85;left:35%;top:60%;transform:scale(.8);filter:brightness(.8)}61%{opacity:1;left:35%;top:60%;transform:scale(1.7);filter:brightness(1.6)}71%{opacity:1;left:35%;top:60%;transform:scale(1.25);filter:brightness(1.3)}96.67%,100%{opacity:1;left:39%;top:76.8%;transform:scale(1);filter:brightness(1)}}
@keyframes l4{0%,24.99%{opacity:.85;left:106%;top:60%;transform:scale(.8);filter:brightness(.8)}48.32%,52%{opacity:.85;left:65%;top:60%;transform:scale(.8);filter:brightness(.8)}61%{opacity:1;left:65%;top:60%;transform:scale(1.7);filter:brightness(1.6)}71%{opacity:1;left:65%;top:60%;transform:scale(1.25);filter:brightness(1.3)}96.67%,100%{opacity:1;left:61%;top:76.8%;transform:scale(1);filter:brightness(1)}}
#loader .l1{animation-name:l1}#loader .l2{animation-name:l2}#loader .l3{animation-name:l3}#loader .l4{animation-name:l4}
#loader .msg{position:absolute;left:0;right:0;top:85%;text-align:center;font-family:"Source Sans 3",system-ui,sans-serif;font-size:12px;letter-spacing:.06em;color:#7f8b9c}
#loader .bar{position:relative;width:52%;max-width:240px;height:2px;margin:8px auto 0;background:rgba(120,150,180,.18);border-radius:2px;overflow:hidden}
#loader .bar::after{content:"";position:absolute;top:0;bottom:0;width:38%;left:-38%;background:linear-gradient(90deg,transparent,#4fc3f7,transparent);animation:sweep 1.5s ease-in-out infinite}
@keyframes sweep{0%{left:-38%}100%{left:100%}}
@media (prefers-reduced-motion:reduce){#loader *{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}#loader .bar::after{left:31%}}
.sr{position:absolute;left:-9999px}
.overlay.top{z-index:60}

/* ===== download button: glassy body + a light orbiting the border (all themes) ===== */
@property --angle{syntax:"<angle>";inherits:false;initial-value:0deg}
.dlbtn{position:relative;background:var(--dl-fill)!important;color:var(--dl-text)!important;border:1px solid var(--dl-border)!important;border-radius:14px!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 18px rgba(0,0,0,.18);transition:transform .12s ease}   /* no backdrop-filter: it would pull the halo in front */
.dlbtn::before,.dlbtn::after{content:"";position:absolute;border-radius:inherit;pointer-events:none;
  background:conic-gradient(from var(--angle),transparent 0deg,transparent 235deg,color-mix(in srgb,var(--spin-color) 25%,transparent) 300deg,var(--spin-color) 345deg,#fff 352deg,var(--spin-color) 357deg,transparent 360deg);
  animation:dlspin var(--spin-duration) linear infinite}
.dlbtn::before{inset:-2px;padding:2px;z-index:1;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.dlbtn::after{inset:-3px;z-index:-1;filter:blur(10px);opacity:.9}   /* the halo: a blurred copy BEHIND the button (no isolation on .dlbtn, so the button body covers it) */
@keyframes dlspin{to{--angle:360deg}}
.dlbtn:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){
  .dlbtn::before,.dlbtn::after{animation:none;background:var(--spin-color)}
  .dlbtn::after{background:var(--spin-glow);opacity:.8}   /* still: a steady glowing border instead of the moving light */
}

/* ===== DUSK THEME: the look (only when Dusk is chosen; Day and Night are unchanged) ===== */
.duskonly{display:none!important}
:root[data-theme="dusk"] .duskonly{display:inline-flex!important}:root[data-theme="dusk"] .mtfoot.duskonly{display:flex!important}
:root[data-theme="dusk"] body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:24px 24px}
:root[data-theme="dusk"] h1{color:var(--ink);text-shadow:0 0 18px var(--glow)}
:root[data-theme="dusk"] h2{color:var(--accent);font-size:1.05rem;letter-spacing:.14em;text-transform:uppercase}
:root[data-theme="dusk"] .label{color:var(--accent);letter-spacing:.06em}
:root[data-theme="dusk"] .card,:root[data-theme="dusk"] .modecard,:root[data-theme="dusk"] .rowmain,:root[data-theme="dusk"] .sheet{border-radius:16px;border:1px solid var(--line);background:var(--paper)}
:root[data-theme="dusk"] .modecard{display:flex;align-items:center;gap:14px}
:root[data-theme="dusk"] .modecard .mtext{display:block;min-width:0}
:root[data-theme="dusk"] .modecard b{color:var(--ink)}
:root[data-theme="dusk"] .btn{border-radius:12px;color:#1A120C}
:root[data-theme="dusk"] .btn.alt{color:var(--sea)}
:root[data-theme="dusk"] .sm,:root[data-theme="dusk"] .chip,:root[data-theme="dusk"] .tool,:root[data-theme="dusk"] .choice,:root[data-theme="dusk"] input,:root[data-theme="dusk"] textarea{border-radius:12px}
:root[data-theme="dusk"] .sm{border-radius:999px;color:var(--ink)}
:root[data-theme="dusk"] .overlay{background:color-mix(in srgb,#0B0806 72%,transparent)}
:root[data-theme="dusk"] .updated{color:var(--muted)}
.mbadge{display:none;flex:none;width:52px;height:52px;border-radius:50%;align-items:center;justify-content:center}
.mbadge svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:root[data-theme="dusk"] .mbadge{display:inline-flex}
.mbadge.amber{background:var(--badge-amber);color:#F0A63A}.mbadge.orange{background:var(--badge-orange);color:#E8893A}
.mbadge.green{background:var(--badge-green);color:#7FD08F}.mbadge.red{background:var(--badge-red);color:#F07A62}
:root[data-theme="dusk"] .tool svg{color:var(--sea)}
.circbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);align-items:center;justify-content:center;padding:0;cursor:pointer}
.circbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.duskpill{align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);padding:6px 14px;font-size:.9rem;min-height:36px;cursor:pointer}
.duskpill svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
:root[data-theme="dusk"] .appbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
:root[data-theme="dusk"] .appbar .brandmini{justify-self:center}
:root[data-theme="dusk"] .appbar .updated{grid-column:1/-1;justify-self:center}
.mtfoot{flex-direction:column;align-items:center;gap:10px;margin:28px 0 8px;text-align:center}
.mtfoot .by{font-style:italic;color:var(--muted);margin:0}
.mtfoot .icons{display:flex;gap:14px;justify-content:center}
.mtfoot .icons a{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.mtfoot .icons svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6}
.mtfoot .icons .fb svg{fill:currentColor;stroke:none}
.mtfoot hr{width:120px;border:0;border-top:1px solid var(--line);margin:4px 0}
.mtfoot .ver{font-size:.8rem;color:var(--muted);margin:0}
</style>

    if (!r.ok) return;

}
const BOOT_AT = Date.now();

function migrateUser() {                                   // keep stars, notes, tags, sessions on the right questions after an update renumbered the bank

  const examMoved = rms.some(r => r.e && Object.keys(r.e).length);
